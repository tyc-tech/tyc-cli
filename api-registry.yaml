# OpenAPI 接口注册表（SSOT）
#
# 本文件是 所有已注册 Tool 的唯一真实来源。
# 设计文档：docs/t1_1/t1_1-final-design-v2.md
# 分类详情：docs/t1_1/apis/<中文分类名>.md（每工具的中英 key 对照表）
#
# ═══════════════════════════════════════════════════════════════════
# - 顶层业务字段 = tyc OpenAPI 返回的英文 key（如 name, creditCode, items, total）
# - 多源合并按 sources 声明顺序做 map 覆盖（后覆盖前）
# - 时间戳字段保留英文 key 名但值转为 Asia/Shanghai 字符串（yyyy-MM-dd 或 yyyy-MM-dd HH:mm:ss）
# - 项目元数据用下划线前缀与 tyc 业务字段区分（_summary / _warnings / _empty）
# ═══════════════════════════════════════════════════════════════════
#
# 字段说明：
#   name              Tool 对外名称（snake_case）
#   group             Go 包名（英文）
#   category_name_zh  中文分类名
#   description       Tool 描述（面向 Agent，中文）
#   params            工具入参列表
#     - name          参数名
#       type          参数类型（string/number/boolean）
#       required      是否必填
#       description   参数说明
#   sources           数据源组合（有序数组，按声明顺序 map 覆盖合并）
#     - path          tyc OpenAPI 相对路径
#       scope         多源合并时各源输出注入的 key（单源固定为 root）
#       params_template 参数模板（Go text/template 语法）
#       required      非关键源失败时是否阻塞（默认 true）
#       condition     可选：模板条件表达式（true 才调用）
#   execution         parallel（默认，并发）| serial（串行，后一步可引用前一步结果）
#   merge             override（后覆盖前，默认）
#   summary           摘要模板（可选）
#     template        模板名：count | count_range | count_truncated | empty_generic | empty_risk
#     label           业务标签（摘要占位符 {label}）

version: "2.0"

categories:
  - group: company
    name_zh: 企业基础信息
    tool_count: 52
  - group: risk
    name_zh: 风险合规
    tool_count: 36
  - group: intellectual_property
    name_zh: 知识产权
    tool_count: 14
  - group: operation
    name_zh: 经营与公示
    tool_count: 32
  - group: history
    name_zh: 历史信息
    tool_count: 18
  - group: executive
    name_zh: 董监高
    tool_count: 15

tools:

