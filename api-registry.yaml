  - name: get_actual_controller
    group: company
    category_name_zh: 企业基础信息
    description: 查询企业的实际控制人详情，适用于企业风险评估、关联交易识别及商业竞争分析场景。
    params:
      - name: searchKey
        type: string
        required: true
        description: 企业名称 或 统一社会信用代码
    sources:
      - path: ic/actualControl/3.0
        scope: root
        params_template: {keyword: "{{.searchKey}}"}
        required: true
    execution: parallel
    summary: {template: count, label: 实际控制人}

